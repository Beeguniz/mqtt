# WebSocket frontend for the existing local broker on 1883.
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true
persistence false
log_dest stdout
connection greenhouse-local
address 127.0.0.1:1883
remote_clientid greenhouse-websocket-bridge
cleansession true
try_private false
topic nhom01/node01/telemetry in 0
topic nhom01/node01/state in 0
topic nhom01/node01/command out 0
